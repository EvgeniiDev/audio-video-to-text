<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>giga-transcribe</title>
<style>
:root { color-scheme: dark; --bg:#14161a; --card:#1e2126; --acc:#7cc4ff; --ok:#7dffa8; --err:#ff8a8a; }
* { box-sizing: border-box; }
body { background:var(--bg); color:#e8e8e8; font:16px/1.5 system-ui,sans-serif; max-width:760px; margin:0 auto; padding:24px 16px 64px; }
h1 { font-size:22px; font-weight:600; }
#drop { border:2px dashed #444; border-radius:12px; padding:40px 20px; text-align:center; color:#999; cursor:pointer; transition:.15s; }
#drop:hover, #drop.over { border-color:var(--acc); color:var(--acc); background:#1a222c; }
.job { position:relative; background:var(--card); border-radius:10px; padding:14px 16px; margin-top:12px; }
.job .top { display:flex; justify-content:space-between; gap:8px; align-items:baseline; }
.job.done .top, .job.error .top { padding-right:30px; }
.job .name { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.job .st { font-size:13px; color:#aaa; white-space:nowrap; }
.bar { height:6px; background:#333; border-radius:3px; margin:10px 0; overflow:hidden; }
.bar > div { height:100%; background:var(--acc); width:0%; transition:width .5s; border-radius:3px; }
.job.uploading .bar > div { width:100%; background:repeating-linear-gradient(110deg,var(--acc) 0 12px,#4a8dbd 12px 24px); background-size:51px 100%; animation:upload 1s linear infinite; }
@keyframes upload { to { background-position:51px 0; } }
@media (prefers-reduced-motion: reduce) { .job.uploading .bar > div { animation:none; } }
.job.done .bar > div { background:var(--ok); }
.job.error .st { color:var(--err); }
.preview { font-size:14px; color:#bbb; max-height:7.5em; overflow:hidden; margin:8px 0; white-space:pre-wrap; }
.btns a { display:inline-block; margin-right:8px; padding:4px 12px; border:1px solid #444; border-radius:6px; color:var(--acc); text-decoration:none; font-size:14px; }
.btns a:hover { border-color:var(--acc); }
.job .delete { position:absolute; top:10px; right:10px; width:28px; height:28px; padding:0; border:0; border-radius:5px; background:transparent; color:#999; font:24px/1 system-ui,sans-serif; cursor:pointer; }
.job .delete:hover { color:var(--err); background:#34272a; }
.job .delete:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
.job .delete:disabled { opacity:.5; cursor:wait; }
.delete-error { color:var(--err); font-size:13px; margin-top:8px; }
.hint { color:#666; font-size:13px; margin-top:16px; }
</style>
</head>
<body>
<h1>🎙 giga-transcribe <span style="color:#666;font-weight:400;font-size:14px">GigaAM v3</span></h1>
<div id="drop">Перетащи видео или аудио сюда<br><span style="font-size:13px">mp4 · mkv · mp3 · wav · m4a · ogg</span></div>
<div id="urlrow" style="display:flex;gap:8px;margin-top:12px">
<input id="url" placeholder="Ссылка YouTube / Boosty…" onkeydown="if(event.key==='Enter')document.getElementById('go').click()" style="flex:1;padding:10px;border-radius:8px;border:1px solid #444;background:#1e2126;color:#e8e8e8">
<button id="go" style="padding:10px 16px;border-radius:8px;border:1px solid #444;background:#1e2126;color:var(--acc);cursor:pointer">➔</button>
</div>
<input id="cookie" placeholder="Кука для приватных постов (необязательно)" onkeydown="if(event.key==='Enter')document.getElementById('go').click()" style="width:100%;margin-top:8px;padding:10px;border-radius:8px;border:1px solid #444;background:#1e2126;color:#e8e8e8">
<p class="hint">Приватный пост на Boosty: открой пост в браузере → F12 → Application → Cookies → скопируй значение куки <b>auth</b> сюда. Без подписки на автора не сработает.</p>
<div id="jobs"></div>
<p class="hint">Страницу можно закрывать — задачи живут на сервере.</p>
<script>
const drop = document.getElementById('drop'), box = document.getElementById('jobs');
const input = Object.assign(document.createElement('input'), {type:'file', accept:'video/*,audio/*', hidden:true});
document.body.appendChild(input);
drop.onclick = () => input.click();
['dragover','dragenter'].forEach(e => drop.addEventListener(e, ev => {ev.preventDefault(); drop.classList.add('over');}));
['dragleave','drop'].forEach(e => drop.addEventListener(e, ev => {ev.preventDefault(); drop.classList.remove('over');}));
drop.addEventListener('drop', ev => [...ev.dataTransfer.files].forEach(send));
input.onchange = () => { [...input.files].forEach(send); input.value = ''; };
function send(file) {
  const el = document.createElement('div');
  el.className = 'job uploading';
  el.innerHTML = '<div class="top"><span class="name"></span><span class="st" role="status"></span></div><div class="bar"><div class="fill"></div></div>';
  el.querySelector('.name').textContent = file.name;
  const status = el.querySelector('.st'), fill = el.querySelector('.fill');
  status.textContent = 'Загрузка на сервер…';
  box.prepend(el);

  const fail = message => {
    el.className = 'job error';
    fill.style.width = '0%';
    status.textContent = 'Ошибка: ' + message;
  };
  const xhr = new XMLHttpRequest();
  xhr.upload.onprogress = ev => {
    if (!ev.lengthComputable || !ev.total) return;
    const pct = Math.min(100, Math.round(ev.loaded / ev.total * 100));
    fill.style.width = pct + '%';
    status.textContent = 'Загрузка на сервер · ' + pct + '%';
  };
  xhr.upload.onload = () => {
    fill.style.width = '100%';
    status.textContent = 'Файл передан · ожидаю сервер…';
  };
  xhr.onload = () => {
    if (xhr.status < 200 || xhr.status >= 300) {
      fail(xhr.responseText || 'сервер вернул код ' + xhr.status);
      return;
    }
    let job;
    try {
      job = JSON.parse(xhr.responseText);
      if (!job || !job.id) throw new Error('missing job id');
    } catch {
      fail('некорректный ответ сервера');
      return;
    }
    render(job);
    el.remove();
  };
  xhr.onerror = () => fail('не удалось загрузить файл. Проверь соединение и попробуй снова.');
  xhr.onabort = () => fail('загрузка отменена');
  const fd = new FormData(); fd.append('f', file);
  xhr.open('POST', '/upload');
  xhr.send(fd);
}
document.getElementById('go').onclick = async () => {
  const url = document.getElementById('url').value.trim();
  if (!url) return;
  const fd = new FormData(); fd.append('url', url);
  const cookie = document.getElementById('cookie').value.trim();
  if (cookie) fd.append('cookie', cookie);
  const r = await fetch('/fetch', {method:'POST', body:fd});
  if (!r.ok) { alert('Ошибка: ' + await r.text()); return; }
  render(await r.json());
}
async function render(j) {
  let el = document.getElementById('j'+j.id);
  if (!el) { el = document.createElement('div'); el.id = 'j'+j.id; el.className = 'job'; box.prepend(el); }
  const response = await fetch('/jobs/'+j.id);
  if (response.status === 404) { el.remove(); delete _t0[j.id]; return; }
  if (!response.ok) { setTimeout(() => render(j), 2000); return; }
  const r = await response.json();
  el.className = 'job ' + (r.status === 'done' ? 'done' : r.status === 'error' ? 'error' : '');
  const st = {queued:'в очереди', downloading:'качаю…', decoding:'декодирую…', slides:'ищу слайды…', transcribing:`${r.progress}% · фраз: ${r.phrases}${eta(r)}`, done:`готово · фраз: ${r.phrases}`, error:'ошибка: '+r.error}[r.status] || r.status;
  el.innerHTML = `<div class="top"><span class="name">${esc(j.filename)}</span><span class="st">${esc(st)}</span>${r.status==='done' || r.status==='error' ? '<button type="button" class="delete" aria-label="Удалить транскрипт" title="Удалить транскрипт">×</button>' : ''}</div>
    <div class="bar"><div style="width:${r.status==='done'?100:r.progress}%"></div></div>
    ${r.preview ? `<div class="preview">${esc(r.preview)}</div>` : ''}
    ${r.status==='done' ? `<div class="btns"><a href="/jobs/${j.id}/text" download="${esc(j.filename)}.txt">.txt</a><a href="/jobs/${j.id}/srt" download="${esc(j.filename)}.srt">.srt</a><a href="/jobs/${j.id}/md" download="${esc(j.filename)}.md">.md</a></div>` : ''}
    ${r.status==='done' || r.status==='error' ? '<div class="delete-error" role="status"></div>' : ''}`;
  const button = el.querySelector('.delete');
  if (button) button.onclick = () => removeJob(j, el, button);
  if (r.status !== 'done' && r.status !== 'error') setTimeout(() => render(j), 2000);
}
async function removeJob(j, el, button) {
  if (button.disabled) return;
  if (!confirm('Удалить транскрипт «' + j.filename + '» и файлы этой задачи?')) return;
  button.disabled = true;
  button.textContent = '…';
  const error = el.querySelector('.delete-error');
  error.textContent = '';
  try {
    const response = await fetch('/jobs/' + j.id, {method:'DELETE'});
    if (!response.ok && response.status !== 404) {
      let message = 'сервер вернул код ' + response.status;
      try { message = (await response.json()).detail || message; } catch {}
      throw new Error(message);
    }
    el.remove();
    delete _t0[j.id];
  } catch (err) {
    error.textContent = 'Не удалось удалить: ' + err.message;
    button.disabled = false;
    button.textContent = '×';
  }
}
// ETA from this job's own pace (done_sec audio per elapsed wall time),
// not a global benchmark — hardware varies wildly. Shown once past 5%.
const _t0 = {};
function eta(r) {
  if (r.status !== 'transcribing' || !r.done_sec || r.progress < 5) return '';
  const now = Date.now() / 1000;
  if (!_t0[r.id]) _t0[r.id] = now;
  const el = now - _t0[r.id];
  if (el < 3) return '';
  const left = Math.round((r.total_sec - r.done_sec) / (r.done_sec / el));
  if (left < 5 || !isFinite(left)) return '';
  return ' · осталось ~' + (left >= 90 ? Math.round(left / 60) + ' мин' : left + ' с');
}
function esc(s){return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
fetch('/jobs').then(r => r.json()).then(js => js.forEach(render));
</script>
</body>
</html>
